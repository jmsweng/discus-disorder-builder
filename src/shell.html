      <h3>Crystal preview <span class="grow"></span><button type="button" class="btn small" data-a="reseed">New draw</button></h3>
      <div class="canvas-box"><canvas id="xcv"></canvas><div class="overlay">drag · shift-drag · wheel</div></div>
      <div class="fields"><span class="hint">Colour by</span>
        <button type="button" class="btn small" data-a="color" data-v="orientation">orientation</button><button type="button" class="btn small" data-a="color" data-v="element">element</button><button type="button" class="btn small" data-a="color" data-v="site">site</button>
        <span class="hint">Cells</span><button type="button" class="btn small" data-a="cells" data-v="1">1</button><button type="button" class="btn small" data-a="cells" data-v="2">2³</button><button type="button" class="btn small" data-a="cells" data-v="3">3³</button><button type="button" class="btn small" data-a="cells" data-v="5">5³</button></div>
      <div class="legend" id="xlegend"></div>
      <div class="stats" id="xstats"></div>
    </section>
    <section class="block">
      <h3>Diffuse preview <span class="grow"></span><button type="button" class="btn small primary" id="dbtn" data-a="diffuse">Compute</button></h3>
      <div class="fields"><span id="planes"></span>
        <label class="f"><span>± range</span><input type="number" id="pv-range" step="0.5" min="0.5" class="w-s"></label>
        <label class="f"><span>cells/axis</span><input type="number" id="pv-n" step="1" min="2" max="16" class="w-s"></label>
        <label class="f"><span>crystals averaged</span><input type="number" id="pv-d" step="1" min="1" max="16" class="w-s"></label></div>
      <details class="custom-plane"><summary>Custom plane</summary>
        <div class="fields plane-vecs">
          <label class="f"><span>u (→)</span><span class="trio"><input type="number" step="any" id="pv-u-0"><input type="number" step="any" id="pv-u-1"><input type="number" step="any" id="pv-u-2"></span></label>
          <label class="f"><span>v (↑)</span><span class="trio"><input type="number" step="any" id="pv-v-0"><input type="number" step="any" id="pv-v-1"><input type="number" step="any" id="pv-v-2"></span></label>
          <label class="f"><span>offset</span><span class="trio"><input type="number" step="any" id="pv-origin-0"><input type="number" step="any" id="pv-origin-1"><input type="number" step="any" id="pv-origin-2"></span></label>
        </div>
        <div class="fields plane-vecs">
          <label class="f"><span>or by (h k l)</span><span class="trio"><input type="number" step="1" id="pv-n-0" value="1"><input type="number" step="1" id="pv-n-1" value="1"><input type="number" step="1" id="pv-n-2" value="1"></span></label>
          <label class="f"><span>layer</span><input type="number" step="any" id="pv-L" value="0" class="w-s"></label>
          <button type="button" class="btn small" data-a="plane-hkl">Set u, v, offset</button>
        </div></details>
      <p class="hint" id="pinfo"></p>
      <div class="progress" id="dprog"><span></span></div>
      <canvas id="dcv" style="width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:4px;background:var(--view);max-width:100%"></canvas>
      <div class="heat-axes" id="daxes"></div>
      <p class="hint" id="dstate">Direct sum in your browser on a small random crystal.</p>
    </section>
  </aside>
</div>
